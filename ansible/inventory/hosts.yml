all:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: /home/ubuntu/.ssh/main.pem

  children:
    control_plane:
      hosts:
        control-plane:
          ansible_host: 10.10.0.10

    workers:
      hosts:
        worker-1:
          ansible_host: 10.10.0.21
        worker-2:
          ansible_host: 10.10.0.22
        worker-3:
          ansible_host: 10.10.0.23
        worker-4:
          ansible_host: 10.10.0.24

    k8s_cluster:
      children:
        control_plane:
        workers:

    jenkins:
      hosts:
        jenkins-1:
          ansible_connection: local
