---
# Docker Compose로 Kafka(KRaft 단일 노드)와 Kafka UI 배포 (Docker는 docker role에서 설치)
- name: Verify Docker Compose is available
  ansible.builtin.command: docker compose version
  changed_when: false

- name: Create Kafka deploy directory
  ansible.builtin.file:
    path: "{{ kafka_dir }}"
    state: directory
    mode: '0755'

# apache/kafka 이미지는 appuser(UID 1000)로 실행된다
- name: Create Kafka data directory
  ansible.builtin.file:
    path: "{{ kafka_data_dir }}"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0755'

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ kafka_dir }}/docker-compose.yml"
    mode: '0644'

- name: Start Kafka and Kafka UI
  community.docker.docker_compose_v2:
    project_src: "{{ kafka_dir }}"
    state: present
    wait: true
    wait_timeout: 180
